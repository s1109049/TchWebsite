<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5456c9"><link rel="icon" href="data:,"><title>課堂管理系統 · Classroom</title><style>/*__CSS__*/</style></head>
<body>
<header><div class="brand"><span class="brand-icon">▦</span><div><strong data-t="課堂管理系統|Classroom"></strong><small data-t="每一課，都從容開始。|A little more room to teach."></small></div></div><div class="header-actions"><button id="language" class="subtle">中 / EN</button><button id="project" class="subtle" data-t="⛶ 投影模式|⛶ Present"></button></div></header>
<div class="workspace"><aside><p class="nav-label" data-t="教學工作台|TEACHING SPACE"></p><nav aria-label="Main navigation">
<button data-tab="lesson"><span>▤</span><span data-t="課堂內容|Lesson"></span></button><button data-tab="picker"><span>✧</span><span data-t="互動點名|Random picker"></span></button><button data-tab="timer"><span>◷</span><span data-t="課堂計時器|Timer"></span></button><button data-tab="homework"><span>▦</span><span data-t="家課交收|Homework"></span></button><button data-tab="admin"><span>⚙</span><span data-t="後台管理|Teacher desk"></span></button>
</nav><div class="aside-note"><span class="dot"></span><span data-t="離線也能安心備課|Made for offline teaching"></span></div></aside>
<main>
<section id="lesson" class="page">
<div class="page-heading"><div><p class="eyebrow" data-t="TODAY’S CLASS|TODAY’S CLASS"></p><h1 data-t="準備好，一起學習。|Let’s learn something new."></h1></div><div class="row"><button id="previous" data-t="← 上一課|← Previous lesson"></button><button id="edit-lesson" class="primary" data-t="編輯課堂|Edit lesson"></button></div></div>
<div id="previous-panel" class="card" hidden></div>
<div class="lesson-grid"><div class="card lesson-intro"><p class="eyebrow" id="lesson-date"></p><h2 id="lesson-title"></h2><p class="section-label" data-t="學習目標|LEARNING GOALS"></p><div id="lesson-goals" class="prose"></div><div id="materials-block" class="inset"><b data-t="準備器材 / 教具|Materials"></b><p id="lesson-materials" class="prose"></p></div><div id="announcement-block" class="inset warm"><b data-t="課後作業 / 公告|Homework & announcements"></b><p id="lesson-announcement" class="prose"></p></div></div>
<div class="card"><div class="card-heading"><h2 data-t="課堂流程|Lesson flow"></h2><span class="pill" id="flow-count"></span></div><div id="lesson-flow"></div></div></div>
<div id="lesson-empty" class="empty card" hidden><span class="empty-icon">✎</span><h2 data-t="從一份簡單的流程開始|Start with a simple lesson plan"></h2><p data-t="在後台加入主題與步驟，即可在這裡展示。|Add a topic and steps at the teacher desk to begin."></p><button id="first-lesson" class="primary" data-t="建立第一課|Create your first lesson"></button></div>
</section>
<section id="picker" class="page" hidden><div class="page-heading"><div><p class="eyebrow">CLASSROOM MOMENTS</p><h1 data-t="讓每個聲音，都被聽見。|Every voice deserves a turn."></h1></div><div class="segmented"><button data-picker="slot" data-t="跑馬燈|Name shuffle"></button><button data-picker="wheel" data-t="幸運輪盤|Lucky wheel"></button></div></div>
<div class="picker-stage"><div class="picker-visual"><div id="shuffle-name" data-t="準備好了嗎？|Ready to join in?"></div><div id="wheel-box" hidden><span class="pointer">▼</span><canvas id="wheel" width="640" height="640" aria-label="Student wheel"></canvas></div></div><div class="picker-result"><p class="eyebrow" data-t="這一刻，輪到你|YOUR MOMENT"></p><div id="picked-name" aria-live="polite">—</div><p id="picker-count"></p><button id="draw" class="primary big" data-t="✧ 幸運抽點|✧ Pick a student"></button><button id="reset-picker" class="subtle" data-t="開始新一輪|Start a new round"></button></div></div><div class="card"><h3 data-t="本輪已抽學生|Picked this round"></h3><div id="picked-list" class="chips"></div></div>
</section>
<section id="timer" class="page" hidden><div class="page-heading"><div><p class="eyebrow">TIME TO FOCUS</p><h1 data-t="專注眼前，掌握節奏。|Find your focus."></h1></div><label class="row"><span data-t="任務字體|Task size"></span><select id="task-size"><option value="28" data-t="標準|Regular"></option><option value="40" data-t="大字|Large"></option><option value="56" data-t="特大|Extra large"></option></select></label></div>
<div class="card timer-card"><label for="timer-task" class="section-label" data-t="當前課堂任務 / 工作說明|CURRENT TASK"></label><textarea id="timer-task" rows="2" aria-label="Current task"></textarea><div id="timer-display" role="timer">05:00</div><div class="progress" role="progressbar" aria-label="Remaining time" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="timer-progress"></div><strong id="timer-percent">100%</strong></div><p id="timer-message" role="status"></p><div class="row center" id="timer-presets"><button data-minutes="1">1</button><button data-minutes="3">3</button><button data-minutes="5">5</button><button data-minutes="10">10</button><button data-minutes="15">15</button><label class="row"><input id="custom-minutes" type="number" min="0.0167" max="180" step="any" value="5" aria-label="Minutes"><span data-t="分鐘|min"></span></label><button id="set-timer" data-t="設定|Set"></button></div><div class="row center timer-buttons"><button id="start-timer" class="primary" data-t="▶ 開始|▶ Start"></button><button id="pause-timer" data-t="Ⅱ 暫停|Ⅱ Pause"></button><button id="reset-timer" data-t="↺ 重設|↺ Reset"></button><label class="row"><input type="checkbox" id="timer-sound"><span data-t="完成音效|Completion sound"></span></label></div></div>
</section>
<section id="homework" class="page" hidden><div class="page-heading"><div><p class="eyebrow">KEEP TRACK, WITH CARE</p><h1 data-t="交收進度，一目了然。|A clearer picture of progress."></h1></div><div class="segmented"><button data-view="single" data-t="單一習作|Single task"></button><button data-view="matrix" data-t="全班總覽|Class overview"></button></div></div>
<div class="card"><div class="row spread"><label class="row" id="homework-selector"><span data-t="習作|Task"></span><select id="hw-select"></select></label><div class="row"><label class="row"><input id="show-rate" type="checkbox"><span data-t="顯示繳交率|Show submission rate"></span></label><label class="row"><input id="edit-records" type="checkbox"><span data-t="編輯紀錄|Edit records"></span></label></div></div><p id="rate" hidden></p><div class="legend"><span class="status submitted" data-t="✓ 已交|✓ Submitted"></span><span class="status missing" data-t="○ 未交|○ Missing"></span><span class="status late" data-t="◷ 遲交|◷ Late"></span><span class="status redo" data-t="↺ 重作|↺ Redo"></span></div><div id="missing-box" class="missing-box"><div class="row spread"><h3 data-t="待跟進 · 未交學生|To follow up · Missing"></h3><button id="copy-missing" data-t="複製名單|Copy names"></button></div><div id="missing-list" class="chips"></div></div><div class="row spread"><input id="student-search" type="search" data-ph="搜尋學生姓名|Search students" aria-label="Search students"><button id="mark-all" hidden data-t="全班標示已交|Mark all submitted"></button></div><div class="table-scroll"><table id="hw-table"></table></div><div id="hw-empty" class="empty" hidden><h3 data-t="尚未有學生或習作|No students or tasks yet"></h3><p data-t="請在後台匯入學生名單，並新增習作。|Import a roster and add a task at the teacher desk."></p></div></div>
</section>
<section id="admin" class="page" hidden><div class="page-heading"><div><p class="eyebrow">YOUR TEACHER DESK</p><h1 data-t="備好下一課。|Make room for your next lesson."></h1></div><button id="logout" hidden data-t="鎖定後台|Lock teacher desk"></button></div>
<form id="login" class="card login"><div class="empty-icon">⚿</div><h2 data-t="老師，歡迎回來|Welcome back, teacher"></h2><label for="password" data-t="請輸入管理密碼|Enter your management password"></label><input id="password" type="password" autocomplete="current-password" required><p id="login-error" class="error" role="alert"></p><button class="primary" data-t="解鎖後台|Unlock teacher desk"></button></form>
<div id="admin-panel" hidden>
<div class="save-panel card"><div><h3 data-t="資料與備份|Data & backups"></h3><p id="save-status" role="status"></p><p class="muted" data-t="自動儲存只保留在這個瀏覽器。轉電腦或使用 USB 前，請匯出備份。|Autosave stays in this browser. Export a backup before moving to another computer or USB."></p></div><div class="row"><button id="save-local" class="primary" data-t="儲存課堂|Save lesson"></button><button id="export-html" data-t="下載離線 HTML|Download offline HTML"></button><button id="export-json" data-t="匯出 JSON|Export JSON"></button><button id="write-file" data-t="連接 / 更新 USB HTML|Connect / update USB HTML"></button><label class="button" for="import-json" data-t="匯入備份|Import backup"></label><input id="import-json" type="file" accept=".json,application/json" hidden></div><p id="file-status" class="muted"></p><details><summary data-t="儲存與隱私說明|Storage & privacy"></summary><p data-t="這是離線工具，後台密碼只防誤觸，不會加密資料。HTML／JSON 備份含學生資料，請妥善保管，不要上傳到公開網站。瀏覽器可能要求重新授權 USB 寫入；取消授權不影響本機資料。|This offline tool uses a password to prevent accidental edits, not encryption. HTML/JSON backups contain student data. Keep them private. Browsers may ask again for USB write permission; cancelling leaves local data intact."></p></details></div>
<div class="card"><div class="card-heading"><h2 data-t="課堂內容|Lesson content"></h2><button id="new-lesson" data-t="封存並建立新課|Archive & start new"></button></div><div class="form-grid"><label><span data-t="單元主題|Lesson topic"></span><input data-lesson="title" id="edit-title"></label><label><span data-t="課堂日期|Lesson date"></span><input data-lesson="date" id="edit-date" type="text"></label></div><label><span data-t="學習目標|Learning goals"></span><textarea data-lesson="objectives" id="edit-objectives" rows="3"></textarea></label><h3 data-t="流程步驟|Lesson steps"></h3><div id="flow-editor"></div><button id="add-step" data-t="＋ 新增流程步驟|＋ Add step"></button><div class="form-grid optional"><div><label class="row"><input data-lesson="showAnnouncement" type="checkbox"><span data-t="加入課後作業 / 公告|Include homework / announcements"></span></label><textarea data-lesson="announcement" rows="3" aria-label="Announcement"></textarea></div><div><label class="row"><input data-lesson="showMaterials" type="checkbox"><span data-t="加入器材 / 教具|Include materials"></span></label><textarea data-lesson="materials" rows="3" aria-label="Materials"></textarea></div></div><p class="muted" data-t="修改會即時同步至課堂內容。|Edits appear immediately in the lesson view."></p></div>
<div class="form-grid"><div class="card"><h2 data-t="流程範本|Flow templates"></h2><div class="row"><input id="preset-name" data-ph="範本名稱|Template name" aria-label="Template name"><button id="save-preset" data-t="儲存範本|Save template"></button></div><div id="preset-list" class="item-list"></div></div><div class="card"><h2 data-t="課堂歷史|Lesson history"></h2><button id="archive-lesson" data-t="封存目前課堂|Archive current lesson"></button><div id="history-list" class="item-list"></div></div></div>
<div class="card"><h2 data-t="學生名單|Student roster"></h2><p class="muted" data-t="每行一位學生；可貼上試算表的「學號、姓名」兩欄。相同姓名會依出現次序保留交收紀錄。|One student per line; paste number/name columns from a spreadsheet. Matching names retain records in occurrence order."></p><textarea id="roster-input" rows="5" aria-label="Student roster"></textarea><div class="row"><button id="import-roster" class="primary" data-t="更新學生名單|Update roster"></button><label class="button" for="roster-file" data-t="讀取 CSV / TXT|Read CSV / TXT"></label><input type="file" id="roster-file" accept=".csv,.txt,text/plain,text/csv" hidden><span id="roster-count"></span></div></div>
<div class="card"><h2 data-t="習作管理|Homework tasks"></h2><div class="row"><input id="new-homework" data-ph="習作名稱|Task name" aria-label="New homework"><button id="add-homework" class="primary" data-t="新增習作|Add task"></button></div><div id="homework-list" class="item-list"></div></div>
</div></section>
</main></div>
<div id="toast" role="status" hidden></div>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-text" class="prose"></p><div class="row end"><button value="cancel" data-t="取消|Cancel"></button><button value="ok" class="primary" data-t="確認|Confirm"></button></div></form></dialog>
<dialog id="conflict-dialog"><h2 data-t="另一個視窗有新版本|Another window has newer data"></h2><p data-t="為避免覆蓋，編輯已暫停。先下載目前版本備份，再載入另一視窗的版本。|Editing is paused to avoid overwriting data. Download this version first, then load the other window’s version."></p><div class="row"><button id="conflict-backup" data-t="下載目前備份|Back up this version"></button><button id="conflict-load" class="primary" data-t="載入新版本|Load newer version"></button></div></dialog>
<script id="embedded-data" type="application/json">null</script>
<script>/*__CORE__*/</script><script>/*__APP__*/</script>
</body></html>
